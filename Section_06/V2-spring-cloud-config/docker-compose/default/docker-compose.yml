services:
  accounts:
    image: "tsiddharth98/accounts:s4"
    container_name: accounts-ms
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - apexbank

  loans:
    image: "tsiddharth98/loans:s4"
    container_name: loans-ms
    ports:
      - "8090:8090"
    deploy:
      resources:
         limits:
           memory: 700m
    networks:
      - apexbank

  cards:
    image: "tsiddharth98/cards:s4"
    container_name: cards-ms
    ports:
      - "9000:9000"
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - apexbank

networks:
  apexbank:
    driver: "bridge"